version: '3.7'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    volumes:
      - storage_data:/app/storage
    
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      # --- VARIABLES CRITIQUES À DÉFINIR DANS L'INTERFACE DOKPLOY ---
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # --- VARIABLES INTERNES ET STATIQUES ---
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod # ✅ CORRECTION: Utilisateur explicite pour la connexion
      - REDIS_URL=redis://redis:6379/1
      
      # 💥 CORRECTION 504/404: Assurer que Rails sert les fichiers statiques et réduction de la concurrence
      - RAILS_SERVE_STATIC_FILES=true
      - WEB_CONCURRENCY=1 # Réduit la charge et les risques de Timeout au démarrage
      - RAILS_LOG_TO_STDOUT=true # Assure que tous les logs Rails (y compris les 404) vont à la console
      
    # 🚨 MISE À JOUR DU PORT: Le serveur écoute maintenant sur le port 3002
    entrypoint: sh -c "until nc -z postgres 5432; do echo 'Waiting for Postgres on 5432...'; sleep 1; done && bundle exec rails db:migrate && bundle exec rails s -p 3002 -b 0.0.0.0"
    command: []
    restart: always
    
    # ➕ MISE À JOUR CRITIQUE: Configuration Traefik la plus robuste
    labels:
      - "traefik.enable=true"
      # Le routeur Traefik doit utiliser le bon hôte
      - "traefik.http.routers.${PROJECT_NAME}-rails.rule=Host(`${FRONTEND_URL}`)"
      # Définition des points d'entrée pour HTTP et HTTPS
      - "traefik.http.routers.${PROJECT_NAME}-rails.entrypoints=web,websecure"
      # Utilise le port interne 3002 du conteneur (MIS À JOUR)
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.port=3002"
      # Le réseau Docker externe pour le routage
      - "traefik.docker.network=${DOKPLOY_NETWORK}"
      # ⏳ AJOUT DU TIMEOUT : Donner 120s à Chatwoot pour répondre
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.timeout=120s"
    
    networks:
      - default
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod # ✅ CORRECTION: Utilisateur explicite pour la connexion
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    networks:
      - default

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=chatwoot_prod # CRÉATION DE L'UTILISATEUR PAR DEFAUT DE CHATWOOT
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - default

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - default
    

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Définition des réseaux
networks:
  default:
    name: chatwoot_default
  dokploy-network:
    external: true
