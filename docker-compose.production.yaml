version: '3.7'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    volumes:
      - storage_data:/app/storage
    
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      # --- VARIABLES CRITIQUES - MISES EN DUR (HARDCODED) ---
      - FRONTEND_URL=http://messagerie-messanger-8i3eqr-22a78a-136-112-175-192.traefik.me
      - SECRET_KEY_BASE=4f36a5b927c1f8d0e7b2a6f5c8d4e1b0a9c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4
      - POSTGRES_PASSWORD=FEfUg4pC66d6
      - REDIS_PASSWORD=G44RTvqBxx57
      
      # --- VARIABLES INTERNES ET STATIQUES ---
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod
      - REDIS_URL=redis://redis:6379/1
      
      # 💥 CORRECTION 504/404: Assurer que Rails sert les fichiers statiques et réduction de la concurrence
      - RAILS_SERVE_STATIC_FILES=true
      - WEB_CONCURRENCY=1
      - RAILS_LOG_TO_STDOUT=true
      
    # Le serveur écoute sur le port 3002
    entrypoint: sh -c "until nc -z postgres 5432; do echo 'Waiting for Postgres on 5432...'; sleep 1; done && bundle exec rails db:migrate && bundle exec rails s -p 3002 -b 0.0.0.0"
    command: []
    restart: always
    
    # Configuration Traefik - utilise maintenant la valeur codée en dur
    labels:
      - "traefik.enable=true"
      # Le label Host doit toujours utiliser la variable d'environnement Dokploy ($FRONTEND_URL) pour le routage Traefik,
      # car Traefik est géré par Dokploy et non par le service Rails.
      # L'application Rails utilisera la variable codée en dur ci-dessus pour ses liens internes.
      - "traefik.http.routers.${PROJECT_NAME}-rails.rule=Host(`${FRONTEND_URL}`)" 
      - "traefik.http.routers.${PROJECT_NAME}-rails.entrypoints=web,websecure"
      # Le port cible est 3002
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.port=3002"
      - "traefik.docker.network=${DOKPLOY_NETWORK}"
      # Timeout pour éviter les Bad Gateway au démarrage
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.timeout=120s"
    
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal 
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      # --- VARIABLES MISES EN DUR ---
      - POSTGRES_PASSWORD=FEfUg4pC66d6
      - REDIS_PASSWORD=G44RTvqBxx57
      - SECRET_KEY_BASE=4f36a5b927c1f8d0e7b2a6f5c8d4e1b0a9c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4
      # --- VARIABLES INTERNES ET STATIQUES ---
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod
      - REDIS_URL=redis://redis:6379/1
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=chatwoot_prod
      # --- VARIABLE MISE EN DUR ---
      - POSTGRES_PASSWORD=FEfUg4pC66d6
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal

  redis:
    image: redis:alpine
    restart: always
    # --- MISE À JOUR DE LA COMMANDE POUR LE MOT DE PASSE EN DUR ---
    command: ["sh", "-c", "redis-server --requirepass \"FEfUg4pC66d6\""]
    volumes:
      - redis_data:/data
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal
    

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Définition des réseaux
networks:
  # ✅ NOUVEAU RÉSEAU INTERNE CRÉÉ LOCALEMENT
  chatwoot-internal:
    driver: bridge
  # L'ancien réseau externe Traefik
  dokploy-network:
    external: true
