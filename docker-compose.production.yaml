version: '3.7'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    volumes:
      - storage_data:/app/storage
    
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      # --- VARIABLES CRITIQUES À DÉFINIR DANS L'INTERFACE DOKPLOY ---
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # --- VARIABLES INTERNES ET STATIQUES ---
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod # ✅ CORRECTION: Utilisateur explicite pour la connexion
      - REDIS_URL=redis://redis:6379/1
      
    # 🚨 MODIFICATION CRITIQUE: Remplacer l'entrypoint pour forcer l'initialisation de la DB
    entrypoint: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    # Ancien: entrypoint: docker/entrypoints/rails.sh
    command: [] # La commande est maintenant intégrée à l'entrypoint
    restart: always
    
    networks:
      - default
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod # ✅ CORRECTION: Utilisateur explicite pour la connexion
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    networks:
      - default

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=chatwoot_prod # CRÉATION DE L'UTILISATEUR PAR DEFAUT DE CHATWOOT
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - default

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - default
    

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Définition des réseaux
networks:
  default:
    name: chatwoot_default
  dokploy-network:
    external: true
