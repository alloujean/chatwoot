version: '3.7'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    volumes:
      - storage_data:/app/storage
    
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      # --- VARIABLES CRITIQUES À DÉFINIR DANS L'INTERFACE DOKPLOY ---
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # --- VARIABLES INTERNES ET STATIQUES ---
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod
      - REDIS_URL=redis://redis:6379/1
      
      # 💥 CORRECTION 504/404: Assurer que Rails sert les fichiers statiques et réduction de la concurrence
      - RAILS_SERVE_STATIC_FILES=true
      - WEB_CONCURRENCY=1
      - RAILS_LOG_TO_STDOUT=true
      
    # Le serveur écoute sur le port 3002
    entrypoint: sh -c "until nc -z postgres 5432; do echo 'Waiting for Postgres on 5432...'; sleep 1; done && bundle exec rails db:migrate && bundle exec rails s -p 3002 -b 0.0.0.0"
    command: []
    restart: always
    
    # Configuration Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-rails.rule=Host(`${FRONTEND_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-rails.entrypoints=web,websecure"
      # Le port cible est 3002
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.port=3002"
      - "traefik.docker.network=${DOKPLOY_NETWORK}"
      # Timeout pour éviter les Bad Gateway au démarrage
      - "traefik.http.services.${PROJECT_NAME}-rails.loadbalancer.server.timeout=120s"
    
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal 
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=chatwoot_prod
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=chatwoot_prod
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    # ✅ MISE À JOUR: Utilisation du nouveau réseau interne explicite
    networks:
      - chatwoot-internal
    

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Définition des réseaux
networks:
  # ✅ NOUVEAU RÉSEAU INTERNE CRÉÉ LOCALEMENT
  chatwoot-internal:
    driver: bridge
  # L'ancien réseau externe Traefik
  dokploy-network:
    external: true
