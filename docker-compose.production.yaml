version: '3.7' # Utilisation d'une version récente

services:
  base: &base
    image: chatwoot/chatwoot:latest
    # ❌ L'env_file est retiré. Les variables sont gérées par Dokploy.
    volumes:
      - storage_data:/app/storage
    # Tous les services (sauf rails) utilisent uniquement le réseau interne (default)

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    # ❌ La section ports: est retirée pour éviter le conflit sur le port 3000
    environment:
      # --- VARIABLES CRITIQUES À DÉFINIR DANS L'INTERFACE DOKPLOY ---
      - FRONTEND_URL=${FRONTEND_URL}        # EXEMPLE: https://imobiznets-messagerie-cqcun4-ef995c-136-112-175-192.traefik.me
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}  # EXEMPLE: 4f36a5b927c1f8d0e7b2a6f5c8d4e1b0a9c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # EXEMPLE: DbChatwootSecure123!
      - REDIS_PASSWORD=${REDIS_PASSWORD}    # EXEMPLE: CacheChatwootSecure456!
      
      # --- VARIABLES INTERNES ET STATIQUES ---
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot
      - REDIS_URL=redis://redis:6379/1
      
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    
    # Réseau Dokploy ajouté pour le routage Traefik
    networks:
      - default
      - dokploy-network

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      # Doit avoir accès à la même SECRET_KEY_BASE, etc.
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    networks:
      - default # Utilise uniquement le réseau interne

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    # ❌ Pas de ports exposés à l'hôte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # Utiliser la variable Dokploy
    networks:
      - default # Utilise uniquement le réseau interne

  redis:
    image: redis:alpine
    restart: always
    # ❌ Pas de ports exposés à l'hôte
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    # ❌ env_file retiré. Le mot de passe est pris directement de l'environnement Dokploy.
    volumes:
      - redis_data:/data
    networks:
      - default # Utilise uniquement le réseau interne
    

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Définition des réseaux
networks:
  default:
    name: chatwoot_default # Nom du réseau interne pour les services
  dokploy-network:
    external: true         # Nom du réseau Dokploy pour Traefik
